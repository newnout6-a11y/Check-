# Pre-commit hooks for the binchecker / webrecon repository.
#
# Run `pre-commit install` once after cloning to wire these hooks into
# `git commit`; CI invokes `pre-commit run --all-files`.
#
# Pinned versions intentionally match (or are newer than) the lower
# bounds declared in `pyproject.toml`'s `[project.optional-dependencies]
# dev` group:
#
#     ruff>=0.4    →  v0.6.9
#     mypy>=1.10   →  v1.11.2
#
# Hooks are deliberately minimal: format + lint + type-check + a couple
# of repo-hygiene checks. Anything beyond that (security scanners,
# secret detection) belongs in CI, not in the inner-loop commit hook.

minimum_pre_commit_version: "3.5.0"

default_language_version:
  python: python3.10

repos:
  # ---------------------------------------------------------------------
  # Repository hygiene
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
        # Skip generated coverage / hypothesis artefacts.
        exclude: |
          (?x)^(
            \.coverage_html/.*|
            \.hypothesis/.*|
            .*\.svg|
            .*\.po|
            .*\.mo
          )$
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: |
          (?x)^(
            \.hypothesis/.*|
            .*\.svg|
            .*\.po|
            .*\.mo
          )$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  # ---------------------------------------------------------------------
  # Ruff: lint + format. The lint hook is run with `--fix` so trivially
  # auto-fixable findings (unused imports, import ordering, modernisable
  # idioms) are corrected in-place; anything left over fails the commit.
  # ---------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint, with --fix)
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff (format)
        types_or: [python, pyi]

  # ---------------------------------------------------------------------
  # Mypy: scoped to the webrecon package (the binchecker package has its
  # own established type-checking workflow). Running the whole tree
  # would be slow on every commit and would re-flag known-relaxed CLI /
  # plugin glue; the `mypy.ini` `[mypy-webrecon.*]` block keeps the
  # webrecon source under strict semantics, which is what Requirement
  # 11.5 asks for.
  # ---------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (webrecon, strict)
        files: ^webrecon/
        args:
          - --config-file=mypy.ini
          - --no-incremental
        # Provide the runtime / dev dependencies pre-commit creates an
        # isolated env for so mypy can resolve imports from the source
        # under check. Versions track `pyproject.toml`'s lower bounds.
        additional_dependencies:
          - httpx>=0.27
          - pydantic>=2.6
          - pydantic-settings>=2.2
          - structlog>=24.1
          - aiosqlite>=0.20
          - beautifulsoup4>=4.12
          - lxml>=5.1
          - jinja2>=3.1
          - types-beautifulsoup4
