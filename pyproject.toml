[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "binchecker"
description = "Layered payment-gateway detection, card validation, and batch processing toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "binchecker maintainers" }]
keywords = ["bin", "card", "payment", "gateway", "stripe", "braintree", "validation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dynamic = ["version"]

# Runtime dependencies — see design.md "Design Decisions and Rationale".
# Shared between `binchecker` and `webrecon` packages so a single
# install pulls in everything both toolkits need at runtime.
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "structlog>=24.1",
    "diskcache>=5.6",
    "jinja2>=3.1",
    "weasyprint>=60.0",
    "babel>=2.14",
    "prompt_toolkit>=3.0",
    # webrecon additions
    "aiosqlite>=0.20",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Console script entry points. `binchecker` dispatches to the argparse
# root in `binchecker.cli.main:main`; `webrecon` dispatches to the
# argparse root in `webrecon.cli.main:main` (see web-reconnaissance
# spec, requirement 7.4).
[project.scripts]
binchecker = "binchecker.cli.main:main"
webrecon = "webrecon.cli.main:main"

# Plugin entry-point group. Third-party plugins declare their entry
# points under this group; `binchecker.plugins.loader` discovers them
# via `importlib.metadata`.
[project.entry-points."binchecker.plugins"]
# (intentionally empty: built-in detectors / validators / providers /
# exporters are registered programmatically; this group exists for
# external plugin packages to populate.)

# ---------------------------------------------------------------------------
# setuptools build configuration
# ---------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "binchecker.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["binchecker*", "webrecon*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"binchecker.export.templates" = ["*.html", "*.html.j2", "*.css", "*.svg"]
"binchecker.i18n.messages" = ["*.po", "*.mo"]
