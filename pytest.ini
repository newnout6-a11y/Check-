# Pytest configuration for the `binchecker` and `webrecon` packages.
#
# Kept in a standalone `pytest.ini` (rather than `[tool.pytest.ini_options]`
# in `pyproject.toml`) so that tasks 1.1 (which authors `pyproject.toml`)
# and 1.3 (this file) can be implemented in parallel without stomping on
# the same file. Note: pytest reads `pytest.ini` with higher precedence
# than `pyproject.toml`, so this file wins if both are present.

[pytest]
minversion = 8.0
testpaths = tests

# `--strict-markers`  → unknown @pytest.mark.* triggers an error rather
#                       than a silent typo
# `-ra`               → short summary lists *all* non-passing outcomes
#                       (failures, errors, skips, xfails) at the end
# `--cov=...`         → coverage gate is scoped to the *critical*
#                       packages called out in Requirement 11.5; other
#                       sub-packages are exercised by tests but do not
#                       count toward the 80% threshold. The webrecon
#                       package is included as a whole so the
#                       web-reconnaissance suite contributes to the
#                       same combined coverage gate.
# `--cov-fail-under`  → fail the run if combined coverage of the listed
#                       sources drops below 80%
# `--cov-branch`      → branch coverage in addition to line coverage
addopts =
    -ra
    --strict-markers
    --cov=binchecker.core
    --cov=binchecker.pipeline
    --cov=binchecker.lookup.chain
    --cov=binchecker.log.pan_filter
    --cov=binchecker.config.loader
    --cov=webrecon
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=80

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom marker registry. With `--strict-markers` set above, every
# marker used in the suite must appear here.
markers =
    property: property-based test (Hypothesis-driven; validates a numbered correctness property from the design)
    integration: integration test that exercises multiple components and may require fixtures or mocked external services
    compliance: compliance test that asserts PCI-safe / regulatory invariants (e.g. PAN never leaked)
    unit: focused unit test for a single function or class
    slow: test whose runtime materially exceeds the unit-test budget; can be deselected with `-m "not slow"`

# Hypothesis defaults are configured in `tests/conftest.py` (see task 1.2).

# pytest-asyncio configuration (used by the `webrecon` test suite under
# `tests/webrecon/`). `auto` mode means async test functions and async
# fixtures are automatically wrapped — no per-test `@pytest.mark.asyncio`
# decorator required. The default fixture loop scope is set explicitly to
# silence the pending-default deprecation warning emitted by
# pytest-asyncio >= 0.23, which `filterwarnings = error` would otherwise
# promote to a hard failure.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

filterwarnings =
    error
    ignore::DeprecationWarning:babel.*
    ignore::DeprecationWarning:weasyprint.*
