; mypy configuration for the `binchecker` and `webrecon` packages.
;
; Kept in a standalone `mypy.ini` (rather than `[tool.mypy]` in
; `pyproject.toml`) so that tasks 1.1 (which authors `pyproject.toml`)
; and 1.3 (this file) can be implemented in parallel without stomping
; on the same file.
;
; Strictness is scoped:
;
;   * `binchecker.{core,pipeline,config,log,lookup}.*` run under the full
;     `--strict` rule set (mypy 1.10 semantics).
;   * Every `webrecon.*` sub-package runs under the same strict rule
;     set (Requirement 11.5 calls for strict typing across the new
;     package).
;   * Test modules under `tests/` and `tests/webrecon/` use the global
;     defaults — they routinely call libraries with looser typings
;     (httpx mock transports, hypothesis strategies returning Any) and
;     we don't want to gate the suite on those stubs.
;
; The rest of the codebase (CLI glue, plugins, exporters, batch I/O,
; i18n) uses the global defaults — they integrate with libraries whose
; typings are looser, and we don't want to gate the whole project on
; their stubs.

[mypy]
python_version = 3.10
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
warn_return_any = True
no_implicit_optional = True
show_error_codes = True
pretty = True

; ----- Strict overrides for critical sub-packages -----
;
; These mirror the flags enabled by `--strict` in mypy 1.10. Listing
; them explicitly (rather than using `strict = True`) makes it obvious
; what each sub-package is held to.

[mypy-binchecker.core.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

[mypy-binchecker.pipeline.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

[mypy-binchecker.config.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

[mypy-binchecker.log.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

[mypy-binchecker.lookup.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

; ----- Strict overrides for the `webrecon` package (Requirement 11.5) -----
;
; The webrecon source is held to the same strict rule set as the critical
; binchecker sub-packages above. Each sub-package gets its own section so
; future per-module relaxations (for example, third-party-heavy modules
; under `webrecon/automation/`) can be applied surgically without weakening
; the whole package.

[mypy-webrecon.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
disallow_subclassing_any = True
disallow_any_generics = True
check_untyped_defs = True
warn_unused_ignores = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
extra_checks = True

; ----- Relaxed type-checking for tests -----
;
; Test code is exempt from the strict rule set. `pytest`, `hypothesis`,
; and `httpx.MockTransport` all expose APIs that are awkward to fully
; annotate; we still get value out of mypy on test files (catch typos
; in attribute access, missing imports) without forcing every fixture
; signature to be fully annotated.

[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True

[mypy-tests.webrecon.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
check_untyped_defs = True

; ----- Third-party libraries without bundled stubs -----
;
; These are silenced so strict checking of our own code doesn't fail
; on `import x` lines for libraries that ship no type information.

[mypy-diskcache.*]
ignore_missing_imports = True

[mypy-weasyprint.*]
ignore_missing_imports = True

[mypy-babel.*]
ignore_missing_imports = True

[mypy-prompt_toolkit.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

; webrecon-specific third-party deps that ship without first-class
; py.typed packages (or whose stubs are incomplete).
[mypy-aiosqlite.*]
ignore_missing_imports = True

[mypy-bs4.*]
ignore_missing_imports = True

[mypy-lxml.*]
ignore_missing_imports = True

[mypy-jinja2.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
